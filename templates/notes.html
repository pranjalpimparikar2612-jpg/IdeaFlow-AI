<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generated Notes - IdeaFlow AI</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- External CSS File -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="notes-body">

    <!-- Navbar -->
    <nav class="navbar notes-nav py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-white d-flex align-items-center gap-2" href="/dashboard">
                <span class="brand-icon"><i class="bi bi-mortarboard-fill text-info"></i></span>
                <span>IdeaFlow <span class="gradient-text">AI</span></span>
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="/notes_history" class="btn btn-edu-outline px-3 py-2">
                    <i class="bi bi-collection me-1"></i> Library
                </a>
                <a href="/dashboard" class="btn btn-edu-outline px-3 py-2">
                    <i class="bi bi-arrow-left me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9">

                <!-- Page Header -->
                <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
                    <div>
                        <h1 class="fw-bold text-white fs-2 mb-1">
                            <i class="bi bi-journal-text text-info me-2"></i> AI Generated Notes
                        </h1>
                        <p class="text-secondary fs-6 mb-0">Summarized and organized content from your uploaded material.</p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex gap-2">
                        <button class="btn btn-edu-outline btn-sm px-3 py-2" onclick="navigator.clipboard.writeText(document.getElementById('notesContent').innerText)">
                            <i class="bi bi-copy me-1"></i> Copy Notes
                        </button>
                    </div>
                </div>

                <!-- Notes Content Card -->
                <div class="card notes-card">
                    <div class="card-body p-4 p-md-5">
                        <pre id="notesContent" class="notes-text-display">{{ notes }}</pre>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
