<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings | IdeaFlow AI</title>

    <!-- Bootstrap 5.3 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Exact App Theme Styles -->
    <style>
        :root {
            --bg-purple: #5b06e3;
            --topbar-bg: #0a0518;
            --card-bg: #140d2b;
            --card-border: rgba(255, 255, 255, 0.1);
            --item-bg: #1c133a;
            --item-hover: #261b4d;
            --accent-cyan: #00d2ff;
            --text-muted: #94a3b8;
        }

        * { font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-purple) !important;
            color: #ffffff !important;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Header */
        .app-navbar {
            background-color: var(--topbar-bg);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.3rem;
            color: #ffffff;
            text-decoration: none;
        }

        .brand-icon {
            background: var(--accent-cyan);
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        /* Main Container Card */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .settings-card {
            background: var(--card-bg) !important;
            border: 1px solid var(--card-border) !important;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            max-width: 580px;
            width: 100%;
        }

        .icon-badge-cyan {
            background: rgba(0, 210, 255, 0.15) !important;
            border: 1px solid rgba(0, 210, 255, 0.3) !important;
            color: var(--accent-cyan);
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-option {
            background: var(--item-bg) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: #ffffff !important;
            border-radius: 14px !important;
            padding: 16px 20px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none !important;
        }

        .settings-option:hover {
            background: var(--item-hover) !important;
            border-color: rgba(0, 210, 255, 0.4) !important;
            transform: translateX(4px);
        }

        .settings-option-danger {
            background: rgba(239, 68, 68, 0.1) !important;
            border: 1px solid rgba(239, 68, 68, 0.2) !important;
            color: #f87171 !important;
        }

        .settings-option-danger:hover {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: rgba(239, 68, 68, 0.4) !important;
        }

        .option-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            margin-right: 14px;
        }

        .icon-blue { background: rgba(0, 210, 255, 0.2); color: var(--accent-cyan); }
        .icon-orange { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .icon-red { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .btn-top-dashboard {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 20px;
            padding: 6px 18px;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-top-dashboard:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-back-pill {
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            border-radius: 50px;
            padding: 8px 24px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .btn-back-pill:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- Header Navbar -->
    <header class="app-navbar">
        <a href="/dashboard" class="brand-logo">
            <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
            IdeaFlow AI
        </a>
        <a href="/dashboard" class="btn-top-dashboard">
            <i class="bi bi-arrow-left me-1"></i> Dashboard
        </a>
    </header>

    <!-- Content Card -->
    <main class="main-wrapper">
        <div class="card settings-card p-4 p-sm-5">
            
            <div class="mb-4 text-start">
                <div class="icon-badge-cyan mb-3">
                    <i class="bi bi-gear-wide-connected fs-3"></i>
                </div>
                <h3 class="fw-bold mb-1 text-white">Account Settings</h3>
                <p class="text-secondary small mb-0">Manage your profile, security, and preferences.</p>
            </div>

            <div class="list-group list-group-flush border-0">
                <a href="/change-name" class="settings-option">
                    <div class="d-flex align-items-center">
                        <div class="option-icon icon-blue"><i class="bi bi-person"></i></div>
                        <div>
                            <div class="fw-semibold text-white">Change Name</div>
                            <div class="text-secondary small">Update your display profile name</div>
                        </div>
                    </div>
                    <i class="bi bi-chevron-right text-secondary"></i>
                </a>

                <a href="/change-password" class="settings-option">
                    <div class="d-flex align-items-center">
                        <div class="option-icon icon-orange"><i class="bi bi-shield-lock"></i></div>
                        <div>
                            <div class="fw-semibold text-white">Change Password</div>
                            <div class="text-secondary small">Update your account security key</div>
                        </div>
                    </div>
                    <i class="bi bi-chevron-right text-secondary"></i>
                </a>

                <a href="/logout" class="settings-option settings-option-danger">
                    <div class="d-flex align-items-center">
                        <div class="option-icon icon-red"><i class="bi bi-box-arrow-right"></i></div>
                        <div>
                            <div class="fw-semibold">Logout</div>
                            <div class="text-secondary small">Sign out of your active session</div>
                        </div>
                    </div>
                    <i class="bi bi-chevron-right text-danger opacity-75"></i>
                </a>
            </div>

            <div class="text-center mt-4 pt-2">
                <a href="/dashboard" class="btn-back-pill">
                    <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
