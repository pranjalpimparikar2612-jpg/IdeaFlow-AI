<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notes Library - IdeaFlow AI</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- External CSS File -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="notes-body">

    <!-- Navigation Bar -->
    <nav class="navbar notes-nav py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-white d-flex align-items-center gap-2" href="/dashboard">
                <span class="brand-icon"><i class="bi bi-mortarboard-fill text-info"></i></span>
                <span>IdeaFlow <span class="gradient-text">AI</span></span>
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="/library" class="btn btn-edu-outline px-3 py-2">
                    <i class="bi bi-collection me-1"></i> Library
                </a>
                <a href="/dashboard" class="btn btn-edu-outline px-3 py-2">
                    <i class="bi bi-arrow-left me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-4">
        <div class="container-box">

            <h2 class="page-title d-flex align-items-center gap-2">
                <i class="bi bi-journal-text text-info"></i> Notes Library
            </h2>

            <!-- Search Form -->
            <form method="GET" class="mb-4">
                <div class="input-group">
                    <input type="text" name="search" class="form-control form-control-dark" placeholder="Search lecture name..." value="{{ request.args.get('search','') }}">
                    <button class="btn btn-cyan px-4" type="submit">
                        <i class="bi bi-search me-1"></i> Search
                    </button>
                </div>
            </form>

            <!-- Notes List Loop -->
            {% if notes %}
                {% for note in notes %}
                <div class="note-card">
                    <div class="note-title">
                        <i class="bi bi-file-earmark-text text-info me-1"></i> {{ note.lecture_name }}
                    </div>

                    <div class="note-date ms-4">
                        <i class="bi bi-calendar-event me-1"></i> {{ note.created_at }}
                    </div>

                    <div class="actions ms-4">
                        <a href="/note/{{ note.id }}" class="btn btn-primary btn-sm px-3">
                            <i class="bi bi-eye-fill me-1"></i> View
                        </a>

                        <a href="/download_pdf/{{ note.id }}" class="btn btn-info btn-sm text-white px-3">
                            <i class="bi bi-file-earmark-pdf-fill me-1"></i> PDF
                        </a>

                        <a href="/quiz/{{ note.id }}" class="btn btn-success btn-sm px-3">
                            <i class="bi bi-patch-question-fill me-1"></i> Quiz
                        </a>

                        <a href="/flashcards/{{ note.id }}" class="btn btn-warning btn-sm text-dark px-3">
                            <i class="bi bi-lightning-charge-fill me-1"></i> Flashcards
                        </a>

                        <a href="/favorite_note/{{ note.id }}" class="btn btn-outline-warning btn-sm px-3">
                            {% if note.favorite %}
                                <i class="bi bi-star-fill me-1"></i> Favorite
                            {% else %}
                                <i class="bi bi-star me-1"></i> Favorite
                            {% endif %}
                        </a>

                        <a href="/delete_note/{{ note.id }}" class="btn btn-danger btn-sm px-3" onclick="return confirm('Are you sure you want to delete this note?')">
                            <i class="bi bi-trash-fill me-1"></i> Delete
                        </a>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="alert alert-dark-custom text-center py-4 my-3">
                    <i class="bi bi-journal-x fs-2 d-block mb-2"></i>
                    No notes found.
                </div>
            {% endif %}

            <!-- Back Button -->
            <div class="text-center mt-4">
                <a href="/library" class="btn btn-edu-outline px-4">
                    <i class="bi bi-arrow-left me-1"></i> Back to Library
                </a>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
