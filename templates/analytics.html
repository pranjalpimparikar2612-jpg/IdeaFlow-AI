<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Learning Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f5f7fb;
        }

        .header {
            background: linear-gradient(135deg, #4f7cff, #6d5dfc);
            color: white;
            padding: 45px 20px;
            border-radius: 0 0 30px 30px;
            margin-bottom: 40px;
            text-align: center;
        }

        .analytics-card {
            border: none;
            border-radius: 20px;
            transition: .35s;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
        }

        .analytics-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 35px rgba(0, 0, 0, .15);
        }

        .icon {
            font-size: 50px;
        }

        .number {
            font-size: 42px;
            font-weight: 700;
            color: #4f7cff;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1 class="fw-bold">
            📊 Learning Analytics
        </h1>

        <p class="mb-0">
            Track your learning progress
        </p>
    </div>

    <div class="container">

        <div class="row g-4">

            <div class="col-md-3">
                <div class="card analytics-card text-center p-4">
                    <div class="icon">🎓</div>
                    <h5 class="mt-3">Lectures</h5>
                    <div class="number">{{ lectures }}</div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card analytics-card text-center p-4">
                    <div class="icon">📄</div>
                    <h5 class="mt-3">Notes</h5>
                    <div class="number">{{ notes }}</div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card analytics-card text-center p-4">
                    <div class="icon">📝</div>
                    <h5 class="mt-3">Quizzes</h5>
                    <div class="number">{{ quizzes }}</div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card analytics-card text-center p-4">
                    <div class="icon">🗂</div>
                    <h5 class="mt-3">Flashcards</h5>
                    <div class="number">{{ flashcards }}</div>
                </div>
            </div>

        </div>

        <div class="card mt-5 p-4 analytics-card">
            <h4 class="mb-4">
                📈 Learning Overview
            </h4>

            <canvas id="analyticsChart" height="100"></canvas>
        </div>

        <div class="card mt-4 p-4 analytics-card text-center">

            <h4>🔥 Study Streak</h4>

            <h1 class="display-4 fw-bold text-primary">
                {{ streak }}
            </h1>

            <p class="text-muted mb-0">
                Day{{ '' if streak == 1 else 's' }} of continuous studying
            </p>

        </div>

        <div class="text-center mt-5">
            <a href="/dashboard" class="btn btn-primary px-4">
                <i class="bi bi-arrow-left"></i>
                Back to Dashboard
            </a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const ctx = document.getElementById('analyticsChart');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [
                    'Lectures',
                    'Notes',
                    'Quizzes',
                    'Flashcards'
                ],
                datasets: [{
                    label: 'Your Progress',
                    data: [
                        {{ lectures}},
                        {{ notes }},
                        {{ quizzes }},
                        {{ flashcards }}
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>

</body>

</html>
