<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Library - IdeaFlow AI</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- External Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background-color: #0d061f !important;
        }

        /* Visible Glassmorphic Container */
        .library-card-wrapper {
            background: rgba(24, 14, 54, 0.85) !important;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* Modern High-Contrast Table Styling */
        .custom-dark-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        .custom-dark-table th {
            color: #38bdf8 !important; /* Bright Cyan Headers */
            font-weight: 700;
            font-size: 14px;
            padding: 14px 20px;
            border: none;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .custom-dark-table td {
            background: rgba(255, 255, 255, 0.06) !important;
            padding: 16px 20px;
            vertical-align: middle;
            color: #ffffff !important; /* Pure White Main Text */
            font-size: 15px;
            font-weight: 500;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        /* Date column text brightness fix */
        .date-text {
            color: #cbd5e1 !important; /* Bright Slate Gray (Readable) */
            font-weight: 500;
        }

        .custom-dark-table tbody tr td:first-child {
            border-top-left-radius: 14px;
            border-bottom-left-radius: 14px;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 700;
            color: #a5b4fc !important; /* Indigo ID */
        }

        .custom-dark-table tbody tr td:last-child {
            border-top-right-radius: 14px;
            border-bottom-right-radius: 14px;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .custom-dark-table tbody tr:hover td {
            background: rgba(255, 255, 255, 0.12) !important;
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.4);
        }

        /* View Button Glow */
        .btn-view-glow {
            background: rgba(34, 197, 94, 0.15) !important;
            color: #4ade80 !important;
            border: 1px solid rgba(34, 197, 94, 0.4) !important;
            border-radius: 30px;
            padding: 7px 20px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-view-glow:hover {
            background: #22c55e !important;
            color: #000000 !important;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <!-- Header Navbar -->
    <nav class="navbar notes-nav py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-white d-flex align-items-center gap-2" href="/dashboard">
                <span class="brand-icon"><i class="bi bi-mortarboard-fill text-info"></i></span>
                <span>IdeaFlow <span class="gradient-text">AI</span></span>
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="/dashboard" class="btn btn-edu-outline px-3 py-2">
                    <i class="bi bi-arrow-left me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 950px;">

        <!-- Main Card Container -->
        <div class="library-card-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-2">
                <h2 class="text-white fw-bold mb-0 fs-3 d-flex align-items-center gap-2">
                    <i class="bi bi-journal-check text-info"></i> Quiz Library
                </h2>
            </div>

            <hr style="border-color: rgba(255, 255, 255, 0.15); margin: 20px 0 25px;">

            {% if quizzes %}
            <div class="table-responsive">
                <table class="custom-dark-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Note ID</th>
                            <th>Date</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for quiz in quizzes %}
                        <tr>
                            <td>#{{ quiz[0] }}</td>
                            <td>Note #{{ quiz[1] }}</td>
                            <td class="date-text">{{ quiz[2] }}</td>
                            <td class="text-end">
                                <a href="/view_quiz/{{ quiz[0] }}" class="btn-view-glow">
                                    <i class="bi bi-eye-fill"></i> View
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            {% else %}
            <div class="text-center py-5">
                <i class="bi bi-inbox text-secondary fs-1 d-block mb-3"></i>
                <p class="text-secondary fs-5 mb-0">No quizzes generated yet.</p>
            </div>
            {% endif %}

        </div>

        <!-- Back Button -->
        <div class="text-center mt-4">
            <a href="/library" class="btn btn-edu-outline px-4 py-2">
                <i class="bi bi-arrow-left me-1"></i> Back to My Library
            </a>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
