<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Handwritten Notes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>

body{
    background:#f5f7fb;
    font-family:Poppins,sans-serif;
}

.page{
    max-width:850px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

img{
    width:100%;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<h1 class="text-center mt-4">
✍️ Handwritten Notes
</h1>

{% for page in pages %}

<div class="page">

<h4 class="mb-3">
Page {{ loop.index }}
</h4>

<img src="{{ url_for('static', filename='handwritten/' + page) }}">

</div>

{% endfor %}

<div class="text-center mb-5">

<a href="/download_handwritten_pdf/{{ note_id }}"
   class="btn btn-success me-2">
    📥 Download PDF
</a>

<a href="/note/{{ note_id }}"
   class="btn btn-primary">
    ← Back to Notes
</a>

</div>

</div>

</body>

</html>
