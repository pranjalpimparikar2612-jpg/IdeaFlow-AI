<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Voice Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            background:#f5f7fb;
            font-family:Poppins,sans-serif;
        }

        .card{

            max-width:800px;
            margin:60px auto;

            border-radius:20px;

            padding:30px;

            box-shadow:0 10px 25px rgba(0,0,0,.08);

        }

        #speech{

            min-height:120px;

        }

    </style>

</head>

<body>

<div class="card">

<h2 class="mb-4 text-center">

🎤 Voice Assistant

</h2>

<div class="mb-3">

<label class="form-label">

Select Lecture

</label>

<select
id="lecture"
class="form-select">

<option value="">Select Lecture...</option>

{% for lecture in lectures %}

<option value="{{ lecture.id }}">
{{ lecture.lecture_name }}
</option>

{% endfor %}

</select>

</div>

<button
id="start-btn"
class="btn btn-danger w-100 mb-4">

🎙 Start Recording

</button>

<label class="fw-bold">

You Said

</label>

<textarea
id="speech"
class="form-control"
readonly>

</textarea>

<div class="mt-4">

<label class="fw-bold">

AI Response

</label>

<textarea
id="answer"
class="form-control"
rows="6"
readonly>
</textarea>

</div>

<div class="text-center mt-4">

<a href="/dashboard"
class="btn btn-primary">

← Back to Dashboard

</a>

</div>

</div>

<script>

const startBtn = document.getElementById("start-btn");
const speechBox = document.getElementById("speech");
const answerBox = document.getElementById("answer");
const lecture = document.getElementById("lecture");

// Check browser support
const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
    alert("Your browser does not support Speech Recognition. Please use Google Chrome.");
} else {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    // Start recording
    startBtn.addEventListener("click", () => {

        if (lecture.value === "") {
            alert("Please select a lecture first.");
            return;
        }

        recognition.start();
        answerBox.value = "Listening...";

    });

    // When speech is recognized
    recognition.onresult = async (event) => {

        const question = event.results[0][0].transcript;

        speechBox.value = question;
        answerBox.value = "Thinking...";

        const formData = new FormData();
        formData.append("note_id", lecture.value);
        formData.append("question", question);

        try {

            const response = await fetch("/voice-chat", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            answerBox.value = data.answer;
            speak(data.answer);

        } catch (error) {

            answerBox.value = "Error connecting to AI.";

            console.error(error);

        }

    };

    recognition.onerror = function(event) {

        answerBox.value = "Speech Recognition Error: " + event.error;

    };

}

</script>

<script>

function speak(text){

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);

}

</script>

</body>

</html>
