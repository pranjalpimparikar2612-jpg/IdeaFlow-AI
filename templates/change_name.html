<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Name | IdeaFlow AI</title>

    <!-- Bootstrap 5.3 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Exact App Theme Styles -->
    <style>
        :root {
            --bg-purple: #5b06e3;
            --topbar-bg: #0a0518;
            --card-bg: #140d2b;
            --card-border: rgba(255, 255, 255, 0.1);
            --input-bg: #1c133a;
            --accent-cyan: #00d2ff;
            --text-muted: #94a3b8;
        }

        * { font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-purple) !important;
            color: #ffffff !important;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .app-navbar {
            background-color: var(--topbar-bg);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.3rem;
            color: #ffffff;
            text-decoration: none;
        }

        .brand-icon {
            background: var(--accent-cyan);
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .settings-card {
            background: var(--card-bg) !important;
            border: 1px solid var(--card-border) !important;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            max-width: 480px;
            width: 100%;
        }

        .icon-badge-cyan {
            background: rgba(0, 210, 255, 0.15) !important;
            border: 1px solid rgba(0, 210, 255, 0.3) !important;
            color: var(--accent-cyan);
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-group-text-theme {
            background: var(--input-bg) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-top-left-radius: 12px !important;
            border-bottom-left-radius: 12px !important;
            color: var(--accent-cyan) !important;
        }

        .form-control-theme {
            background: var(--input-bg) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            color: #ffffff !important;
            border-top-right-radius: 12px !important;
            border-bottom-right-radius: 12px !important;
            padding: 12px 16px;
        }

        .form-control-theme:focus {
            border-color: var(--accent-cyan) !important;
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.2) !important;
            outline: none;
        }

        .btn-cyan {
            background: var(--accent-cyan);
            color: #0b0719;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-cyan:hover {
            background: #33d9ff;
            color: #0b0719;
        }

        .btn-cancel {
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            border-radius: 12px;
            padding: 12px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .btn-top-dashboard {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 20px;
            padding: 6px 18px;
            font-size: 0.9rem;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header class="app-navbar">
        <a href="/dashboard" class="brand-logo">
            <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
            IdeaFlow AI
        </a>
        <a href="/dashboard" class="btn-top-dashboard">
            <i class="bi bi-arrow-left me-1"></i> Dashboard
        </a>
    </header>

    <main class="main-wrapper">
        <div class="card settings-card p-4 p-sm-5">
            
            <div class="mb-4 text-start">
                <div class="icon-badge-cyan mb-3">
                    <i class="bi bi-person-gear fs-3"></i>
                </div>
                <h3 class="fw-bold mb-1 text-white">Change Name</h3>
                <p class="text-secondary small mb-0">Update your account profile name across IdeaFlow AI workspace.</p>
            </div>

            <form method="POST">
                <div class="mb-4">
                    <label class="form-label text-secondary small fw-semibold text-uppercase">New Name</label>
                    <div class="input-group">
                        <span class="input-group-text input-group-text-theme border-end-0">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="name" class="form-control form-control-theme border-start-0" placeholder="Enter your new name" required autocomplete="off">
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-cyan">
                        <i class="bi bi-check-lg me-1"></i> Save Changes
                    </button>
                    <a href="/settings" class="btn btn-cancel mt-1">Cancel</a>
                </div>
            </form>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
