<!DOCTYPE html>
<html lang="en">

<head>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

background:
radial-gradient(circle at top left,#7f7fd5 0%,transparent 35%),
radial-gradient(circle at bottom right,#00d4ff 0%,transparent 35%),
linear-gradient(135deg,#eef2ff,#dbeafe);

overflow-x:hidden;

}

/* Floating Blobs */

.blob{

position:fixed;

width:320px;
height:320px;

border-radius:50%;

filter:blur(70px);

z-index:-1;

animation:float 12s ease-in-out infinite;

}

.blob1{

background:#7c3aed55;

top:-100px;
left:-80px;

}

.blob2{

background:#3b82f655;

bottom:-120px;
right:-80px;

}

@keyframes float{

50%{

transform:translateY(40px) translateX(30px);

}

}

.container{

padding-top:60px;
padding-bottom:60px;

max-width:900px;

}

/* Header */

.header{

text-align:center;

margin-bottom:40px;

}

.title{

font-size:3rem;

font-weight:700;

background:linear-gradient(90deg,#4f46e5,#7c3aed);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.subtitle{

color:#6b7280;

font-size:18px;

margin-top:10px;

}

/* Quiz Card */

.quiz-card{

background:rgba(255,255,255,.75);

backdrop-filter:blur(18px);

border-radius:28px;

padding:40px;

box-shadow:0 18px 40px rgba(0,0,0,.08);

}

/* Progress */

.progress{

height:12px;

border-radius:30px;

background:#dbeafe;

margin-bottom:30px;

}

.progress-bar{

background:linear-gradient(90deg,#4f46e5,#7c3aed);

transition:.4s;

}

/* Question */

.question{

font-size:24px;

font-weight:700;

color:#1f2937;

margin-bottom:30px;

}

/* Options */

.option{

display:block;

width:100%;

padding:16px 20px;

margin-bottom:15px;

border:none;

border-radius:16px;

background:white;

font-size:17px;

font-weight:500;

text-align:left;

transition:.25s;

box-shadow:0 8px 20px rgba(0,0,0,.05);

cursor:pointer;

}

.option:hover{

transform:translateY(-2px);

background:#eef2ff;

}

.option.correct{

background:#22c55e;

color:white;

}

.option.wrong{

background:#ef4444;

color:white;

}

.option:disabled{

cursor:not-allowed;

}

/* Next Button */

#nextBtn,
#restartBtn{

display:none;

margin-top:25px;

padding:14px 35px;

border:none;

border-radius:50px;

background:linear-gradient(135deg,#4f46e5,#7c3aed);

color:white;

font-weight:600;

transition:.3s;

}

#nextBtn:hover,
#restartBtn:hover{

transform:translateY(-2px);

}

/* Result */

#result{

display:none;

text-align:center;

}

#finalScore{

font-size:30px;

font-weight:700;

color:#4f46e5;

margin-top:20px;

}

#message{

font-size:20px;

margin-top:15px;

font-weight:600;

color:#374151;

}

.back-btn{

margin-top:30px;

}

</style>

</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="container">
    <div class="header">

    <h1 class="title">
        <i class="bi bi-patch-question-fill"></i>
        AI Quiz
    </h1>

    <p class="subtitle">
        Test your knowledge with AI-generated questions
    </p>

</div>

<div class="quiz-card">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <span class="fw-semibold">
            <i class="bi bi-lightning-charge-fill text-warning"></i>
            AI Generated Quiz
        </span>

        <span id="counter" class="text-muted">
            Question <span id="currentQuestion">1</span> /
            {{ quiz_data|length }}
        </span>

    </div>

    <div class="progress">

        <div
            class="progress-bar"
            id="progressBar"
            style="width:0%">
        </div>

    </div>

    <div id="quizContainer">

        {% for q in quiz_data %}

        <div class="question-block"
             {% if not loop.first %}style="display:none;"{% endif %}>

            <div class="question">

                {{ q.question }}

            </div>

            {% for option in q.options %}

            <button
                class="option"
                data-answer="{{ q.answer | e }}"
                data-answer-letter="{{ q.answer_letter | default('') | e }}"

                onclick="checkAnswer(this)">

                {{ option }}

            </button>

            {% endfor %}

        </div>

        {% endfor %}

    </div>

    <div class="text-center">

        <button
            id="nextBtn">

            Next Question
            <i class="bi bi-arrow-right"></i>

        </button>

    </div>

    <div id="result">

        <i class="bi bi-trophy-fill"
           style="font-size:70px;color:#f59e0b;"></i>

        <h2 class="mt-3">

            Quiz Completed!

        </h2>

        <div id="finalScore"></div>

        <div id="message"></div>

        <button
            id="restartBtn">

            <i class="bi bi-arrow-repeat"></i>

            Retry Quiz

        </button>

        <br>

        <a href="/quiz_history" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left-circle-fill"></i>
            Back to Quiz Library
        </a>

        

    </div>

</div>
<script>

let current = 0;
let score = 0;

const questions = document.querySelectorAll(".question-block");

const nextBtn = document.getElementById("nextBtn");

const progressBar = document.getElementById("progressBar");

const currentQuestion = document.getElementById("currentQuestion");

const result = document.getElementById("result");

const quizContainer = document.getElementById("quizContainer");

const finalScore = document.getElementById("finalScore");

const message = document.getElementById("message");

const restartBtn = document.getElementById("restartBtn");

updateProgress();

function checkAnswer(button){

    if(button.parentElement.classList.contains("answered"))
        return;

    button.parentElement.classList.add("answered");

    const correct = button.dataset.answer;
    const correctLetter = button.dataset.answerLetter;

    const buttons = button.parentElement.querySelectorAll(".option");

    buttons.forEach(btn=>{

        btn.disabled=true;

        if(btn.innerText.trim() === correct.trim() || btn.innerText.trim().startsWith(correctLetter)){

            btn.classList.add("correct");

        }

    });

    if(button.innerText.trim() === correct.trim() || button.innerText.trim().startsWith(correctLetter)){

        score++;

    }

    else{

        button.classList.add("wrong");

    }

    nextBtn.style.display="inline-block";

}

nextBtn.addEventListener("click",()=>{

    questions[current].style.display="none";

    current++;

    if(current>=questions.length){

        showResult();

        return;

    }

    questions[current].style.display="block";

    currentQuestion.innerText=current+1;

    nextBtn.style.display="none";

    updateProgress();

});

function updateProgress(){

    progressBar.style.width=
    ((current+1)/questions.length*100)+"%";

}
function showResult(){

    quizContainer.style.display="none";

    nextBtn.style.display="none";

    result.style.display="block";

    let percentage=Math.round((score/questions.length)*100);

    finalScore.innerHTML=

    score+" / "+questions.length+

    " ("+percentage+"%)";

    if(percentage>=90){

        message.innerHTML="🏆 Outstanding!";

    }

    else if(percentage>=75){

        message.innerHTML="🎉 Excellent Work!";

    }

    else if(percentage>=60){

        message.innerHTML="👍 Good Job!";

    }

    else if(percentage>=40){

        message.innerHTML="📚 Keep Practicing!";

    }

    else{

        message.innerHTML="💪 Don't Give Up!";

    }

    restartBtn.style.display="inline-block";

}

restartBtn.addEventListener("click",()=>{

    location.reload();

});

</script>

</div>
<div class="text-center mt-5 mb-4">

    <a href="/library" class="btn btn-outline-primary px-4 py-2">

        <i class="bi bi-arrow-left-circle-fill"></i>

        Back to Library

    </a>

</div>
</body>

</html>
