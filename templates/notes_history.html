<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Notes Library</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

body{
    background:#f5f7fb;
    font-family:'Poppins',sans-serif;
}

.container-box{
    max-width:1100px;
    margin:50px auto;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.page-title{
    font-weight:700;
    margin-bottom:30px;
}

.note-card{

    border:1px solid #eee;

    border-radius:16px;

    padding:20px;

    margin-bottom:20px;

    transition:.3s;

}

.note-card:hover{

    transform:translateY(-4px);

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.note-title{

    font-size:20px;

    font-weight:600;

    margin-bottom:6px;

}

.note-date{

    color:#6c757d;

    font-size:14px;

}

.actions{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-top:18px;

}

.btn{

    border-radius:10px;

}

</style>

</head>

<body>

<div class="container">

<div class="container-box">

<h2 class="page-title">📄 Notes Library</h2>

<form method="GET" class="mb-4">

<div class="input-group">

<input
type="text"
name="search"
class="form-control"
placeholder="Search lecture name..."
value="{{ request.args.get('search','') }}">

<button class="btn btn-primary">
<i class="bi bi-search"></i> Search
</button>

</div>

</form>

{% if notes %}

{% for note in notes %}

<div class="note-card">

<div class="note-title">

📄 {{ note.lecture_name }}

</div>

<div class="note-date">

<i class="bi bi-calendar-event"></i>

{{ note.created_at }}

</div>

<div class="actions">

<a href="/note/{{ note.id }}"
class="btn btn-primary btn-sm">

<i class="bi bi-eye-fill"></i>

View

</a>

<a href="/download_pdf/{{ note.id }}"
   class="btn btn-info btn-sm">

    <i class="bi bi-file-earmark-pdf-fill"></i>

    PDF

</a>

<a href="/quiz/{{ note.id }}"
class="btn btn-success btn-sm">

<i class="bi bi-patch-question-fill"></i>

Quiz

</a>

<a href="/flashcards/{{ note.id }}"
class="btn btn-warning btn-sm">

<i class="bi bi-lightning-charge-fill"></i>

Flashcards

</a>

<a href="/favorite_note/{{ note.id }}"
class="btn btn-outline-warning btn-sm">

{% if note.favorite %}
⭐ Favorite
{% else %}
☆ Favorite
{% endif %}

</a>

<a href="/delete_note/{{ note.id }}"
class="btn btn-danger btn-sm">

<i class="bi bi-trash-fill"></i>

Delete

</a>

</div>

</div>

{% endfor %}

{% else %}

<div class="alert alert-info text-center">

No notes found.

</div>

{% endif %}

<div class="text-center mt-4">

<a href="/library" class="btn btn-secondary">

<i class="bi bi-arrow-left"></i>

Back to Library

</a>

</div>

</div>

</div>

</body>

</html>
